name: Build OwpenGram Android (debug APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: owpengram-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble Afat Debug
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK/NDK via gradle (cached by .gradle dir)
        run: |
          mkdir -p $HOME/.gradle
          # sdk/ndk are pulled by gradle plugin from sdkmanager licenses below
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate debug keystore (release.keystore is gitignored)
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -storepass 817564a59f09a3aa2ebc9029 \
            -keypass 817564a59f09a3aa2ebc9029 \
            -alias owpengramkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OwpenGram, OU=Build, O=OwpenGram, L=Build, S=Build, C=US"

      - name: Build Afat Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace --no-daemon

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find . -type f -name "*.apk" -path "*outputs*" -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owpengram-apk-debug
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
